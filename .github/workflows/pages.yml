name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN cannot create a Pages site (needs admin). Push the built
# files to gh-pages instead; that only needs contents:write.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true

      - name: Pages setup hint
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## GitHub Pages"
            echo "The built site was pushed to the \`gh-pages\` branch."
            echo
            echo "If https://mac-mvak.github.io/TheAmazingDigitalService/ still 404s, open"
            echo "https://github.com/${{ github.repository }}/settings/pages"
            echo "set **Source** to **Deploy from a branch**, branch **gh-pages**, folder **/ (root)**, and save."
          } >> "$GITHUB_STEP_SUMMARY"
